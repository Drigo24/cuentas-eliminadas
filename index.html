<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Eliminar cuenta - DEXA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .box {
      background: white;
      padding: 30px;
      border-radius: 12px;
      max-width: 400px;
      text-align: center;
    }

    h1 {
      color: #0f172a;
    }

    p {
      color: #475569;
      font-size: 14px;
    }

    a.button {
      display: inline-block;
      margin-top: 20px;
      background: #2563eb;
      color: white;
      padding: 12px 20px;
      border-radius: 8px;
      text-decoration: none;
    }

    a.button:hover {
      background: #1e40af;
    }
  </style>
</head>

<body>

<div class="box">
  <h1>Eliminar cuenta DEXA</h1>

  <p>
    Para solicitar la eliminación de tu cuenta, envía un correo con tu email registrado.
  </p>

  <a class="button" href="mailto:contacto@dexavision.cl?subject=Eliminar%20cuenta%20DEXA">
    Solicitar eliminación
  </a>

  <p style="margin-top:15px; font-size:12px;">
    Tus datos serán eliminados en un plazo máximo de 72 horas.
  </p>
</div>

</body>
</html>
